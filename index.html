<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gen-Chassis | Coming Soon</title>
  <meta name="description" content="Gen-Chassis car stickers and decals. Coming soon.">
  <meta property="og:title" content="Gen-Chassis">
  <meta property="og:description" content="Car stickers and decals. Coming soon.">
  <meta property="og:url" content="https://www.gen-chassis.com">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0b0c'/%3E%3Ctext x='32' y='44' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-size='34' fill='%23ff3b1f' text-anchor='middle'%3EGC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #f4f4f5;
      --muted: #8a8a92;
      --accent: #ff3b1f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* racing stripes */
    .stripes {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        linear-gradient(90deg, transparent calc(50% - 70px), var(--accent) calc(50% - 70px),
          var(--accent) calc(50% - 20px), transparent calc(50% - 20px),
          transparent calc(50% + 20px), var(--accent) calc(50% + 20px),
          var(--accent) calc(50% + 70px), transparent calc(50% + 70px));
      opacity: .07;
    }
    .bg-video::-webkit-media-controls,
    .bg-video::-webkit-media-controls-panel,
    .bg-video::-webkit-media-controls-overlay-play-button,
    .bg-video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none;
      opacity: 0 !important;
    }
    .bg-video {
      pointer-events: none;
      position: fixed; inset: 0; z-index: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      background: var(--bg) url("poster.jpg") center / cover no-repeat;
    }
    .bg-tint {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at center, rgba(11,11,12,.62) 0%, rgba(11,11,12,.82) 100%);
    }
    .logo-img { filter: drop-shadow(0 2px 12px rgba(0,0,0,.6)); }
    .soon { text-shadow: 0 2px 10px rgba(0,0,0,.7); }
    .links { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .ig { background: rgba(11,11,12,.45); border-color: rgba(255,255,255,.25); }
    footer { text-shadow: 0 1px 6px rgba(0,0,0,.8); }
    main {
      position: relative; z-index: 1;
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding: 48px 16px;
    }
    .logo {
      font-family: "Archivo Black", Impact, sans-serif;
      font-size: clamp(2.6rem, 11vw, 7.5rem);
      line-height: .95;
      letter-spacing: -.02em;
      text-transform: uppercase;
      font-style: italic;
    }
    .logo span { color: var(--accent); }
    .logo-wrap { line-height: 0; }
    .logo-img {
      display: block;
      width: min(560px, 85vw);
      max-height: 40vh;
      height: auto;
      object-fit: contain;
    }
    .bar {
      width: 96px; height: 6px; background: var(--accent);
      margin: 28px auto; transform: skewX(-20deg);
    }
    .soon {
      font-weight: 600;
      font-size: clamp(1rem, 3.5vw, 1.35rem);
      letter-spacing: .4em;
      text-transform: uppercase;
      padding-left: .4em; /* balance letter-spacing */
    }
    .tag {
      margin-top: 16px;
      color: var(--muted);
      font-size: clamp(.95rem, 2.8vw, 1.1rem);
      max-width: 32ch;
    }
    .ig {
      display: inline-flex; align-items: center; gap: 10px;
      color: var(--fg); text-decoration: none;
      font-weight: 600; font-size: 1rem;
      padding: 10px 18px;
      border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
      background: rgba(11,11,12,.45);
      transition: border-color .2s, color .2s;
    }
    .ig:hover, .ig:focus-visible { border-color: var(--accent); color: var(--accent); }
    footer {
      position: relative; z-index: 1;
      text-align: center;
      padding: 20px 16px 28px;
      color: var(--muted);
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline webkit-playsinline disablepictureinpicture disableremoteplayback preload="auto" poster="poster.jpg" aria-hidden="true">
    <source src="background.mp4" type="video/mp4">
  </video>
  <div class="bg-tint" aria-hidden="true"></div>
  <main>
    <h1 class="logo-wrap">
      <img class="logo-img" src="logo.png" alt="Gen-Chassis"
           onerror="this.parentNode.innerHTML='<span class=&quot;logo&quot;>Gen<span>-</span>Chassis</span>'">
    </h1>
    <div class="bar" aria-hidden="true"></div>
    <p class="soon">Coming Soon</p>
    <div class="links">
    <a class="ig" href="shop/">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      Shop
    </a>
    <a class="ig" href="https://www.instagram.com/sitdownintherain/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6" fill="currentColor"/>
      </svg>
      @sitdownintherain
    </a>
    </div>
  </main>
  <footer>&copy; <span id="y">2026</span> Gen-Chassis &middot; www.gen-chassis.com</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
  <script>
    // Keep the background video playing: restart it instantly if it ever stops.
    (function () {
      var v = document.querySelector('.bg-video');
      if (!v) return;
      v.muted = true;
      function play() { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
      v.addEventListener('ended', function () { v.currentTime = 0; play(); });
      v.addEventListener('pause', function () { if (!document.hidden) play(); });
      document.addEventListener('visibilitychange', function () { if (!document.hidden) play(); });
      document.addEventListener('touchstart', play, { once: true, passive: true });
      play();
    })();
  </script>
</body>
</html>
